<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070b16" />
  <title>俄罗斯方块</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(14, 20, 40, 0.72);
      --line: rgba(120, 190, 255, 0.18);
      --text: #e8f1ff;
      --muted: #8aa0c4;
      --accent: #5ce1ff;
      --pink: #ff5dad;
      --cell: 30px;
      --gap: 2px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 20% -10%, #1a2a55 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #3a1450 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 20px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
    }

    .layout {
      display: grid;
      grid-template-columns: 118px auto 150px;
      grid-template-areas:
        "hold board next"
        "hold board stats";
      gap: 14px;
      align-items: start;
    }

    .hold { grid-area: hold; }
    .board-wrap { grid-area: board; }
    .side { grid-area: next; }
    .stats-panel { grid-area: stats; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.28);
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
    }

    .stat {
      margin-bottom: 12px;
    }

    .stat b {
      display: block;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .board-wrap {
      position: relative;
      padding: 10px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #board {
      width: calc(10 * var(--cell));
      height: calc(20 * var(--cell));
      background: #050814;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(92, 225, 255, 0.16), 0 0 32px rgba(92, 225, 255, 0.08);
    }

    .mini {
      width: 96px;
      height: 72px;
      background: #050814;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 20, 0.72);
      border-radius: 8px;
      text-align: center;
      padding: 16px;
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.12em;
    }

    .overlay p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
    }

    .primary {
      background: linear-gradient(180deg, #73f0ff, #2ec6e6);
      color: #05202a;
      font-weight: 700;
      border-radius: 999px;
      padding: 10px 22px;
      letter-spacing: 0.12em;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
      text-align: center;
      max-width: 720px;
    }

    kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
    }

    .controls {
      display: none;
      width: min(420px, 100%);
      margin-top: 14px;
      gap: 8px;
      user-select: none;
    }

    .controls button {
      background: rgba(14, 20, 40, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 48px;
      font-size: 16px;
      touch-action: manipulation;
    }

    .row { display: grid; gap: 8px; }
    .row-3 { grid-template-columns: 1fr 1fr 1fr; }
    .row-2 { grid-template-columns: 1fr 1fr; margin-top: 8px; }

    .topbar {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      :root { --cell: 22px; }
      body { padding: 10px 10px 16px; }
      .layout {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "hold next"
          "stats stats"
          "board board";
        width: min(100%, 420px);
      }
      .board-wrap { justify-self: center; width: 100%; }
      .board-wrap.panel { padding: 8px; }
      .stats-panel {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 10px;
      }
      .stats-panel .stat { margin: 0; }
      .stats-panel .stat b { font-size: 16px; }
      .hold .hint { display: none; }
      #next1, #next2 { display: none; }
      .controls { display: grid; }
      p.hint { display: none; }
      h1 { font-size: 20px; letter-spacing: 0.18em; text-indent: 0.18em; }
      .subtitle { margin-bottom: 10px; }
      .mini { width: 100%; height: 64px; }
    }
  </style>
</head>
<body>
  <h1>俄罗斯方块</h1>
  <p class="subtitle">CLASSIC TETRIS</p>

  <div class="layout">
    <div class="panel hold">
      <div class="topbar">
        <button class="ghost-btn" id="muteBtn" type="button">声音 开</button>
      </div>
      <div class="label">HOLD / 暂存</div>
      <canvas class="mini" id="hold" width="96" height="72"></canvas>
      <div class="hint" style="text-align:left;margin:8px 0 0;max-width:none;">
        <kbd>C</kbd> 暂存<br />
        <kbd>P</kbd> 暂停<br />
        <kbd>R</kbd> 重开
      </div>
    </div>

    <div class="panel board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">准备开始</h2>
        <p id="overlayText">消除整行得分。方块叠到顶部游戏结束。</p>
        <button class="primary" id="startBtn" type="button">开始游戏</button>
      </div>
    </div>

    <div class="panel side">
      <div class="label">NEXT / 下一个</div>
      <canvas class="mini" id="next0" width="96" height="72"></canvas>
      <canvas class="mini" id="next1" width="96" height="72"></canvas>
      <canvas class="mini" id="next2" width="96" height="72"></canvas>
    </div>
    <div class="panel stats-panel">
      <div class="stat"><div class="label">SCORE</div><b id="score">0</b></div>
      <div class="stat"><div class="label">HIGH</div><b id="high">0</b></div>
      <div class="stat"><div class="label">LINES</div><b id="lines">0</b></div>
      <div class="stat"><div class="label">LEVEL</div><b id="level">1</b></div>
    </div>
  </div>

  <div class="controls">
    <div class="row row-3">
      <button type="button" data-act="hold">暂存</button>
      <button type="button" data-act="rotate">旋转</button>
      <button type="button" data-act="hard">直落</button>
    </div>
    <div class="row row-3" style="margin-top:8px">
      <button type="button" data-act="left">←</button>
      <button type="button" data-act="down">↓</button>
      <button type="button" data-act="right">→</button>
    </div>
    <div class="row row-2">
      <button type="button" data-act="pause">暂停</button>
      <button type="button" data-act="restart">重开</button>
    </div>
  </div>

  <p class="hint">
    <kbd>←</kbd><kbd>→</kbd> 移动
    <kbd>↓</kbd> 软降
    <kbd>空格</kbd> 硬降
    <kbd>↑</kbd>/<kbd>X</kbd> 顺时针
    <kbd>Z</kbd> 逆时针
    <kbd>C</kbd> 暂存
    <kbd>P</kbd> 暂停
  </p>

  <script src="engine.js"></script>
  <script>
    (function () {
      const E = window.TetrisEngine;
      const COLORS = {
        I: "#2de6ea",
        O: "#f0d44c",
        T: "#c46bff",
        S: "#4adf6a",
        Z: "#ff5d6c",
        J: "#4d7dff",
        L: "#ff9a3c",
        G: "#8aa0c4",
        X: "#8aa0c4",
      };

      const boardCanvas = document.getElementById("board");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const muteBtn = document.getElementById("muteBtn");
      const holdCanvas = document.getElementById("hold");
      const nextCanvases = [0, 1, 2].map(function (i) {
        return document.getElementById("next" + i);
      });

      const HIGH_KEY = "tetris-high-score-v1";
      const MUTE_KEY = "tetris-muted";
      let high = Number(localStorage.getItem(HIGH_KEY) || 0);
      let muted = localStorage.getItem(MUTE_KEY) === "1";
      document.getElementById("high").textContent = String(high);

      let game = E.createGame({ seed: Date.now() % 1e9, now: 0 });
      let audioCtx = null;
      const keys = Object.create(null);
      let dasDir = 0;
      let dasAt = 0;
      let arrAt = 0;
      const DAS = 160;
      const ARR = 45;

      function beep(freq, dur, type, gain) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type || "square";
          osc.frequency.value = freq;
          g.gain.setValueAtTime(gain || 0.04, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
        } catch (e) {}
      }

      function handleEvents(events) {
        for (let i = 0; i < events.length; i++) {
          const ev = events[i];
          if (ev.type === "move") beep(220, 0.04, "square", 0.02);
          if (ev.type === "rotate") beep(420, 0.05, "square", 0.03);
          if (ev.type === "lock") beep(160, 0.07, "triangle", 0.04);
          if (ev.type === "hard") beep(140, 0.08, "sawtooth", 0.04);
          if (ev.type === "clear") beep(ev.count === 4 ? 880 : 520, 0.16, "square", 0.06);
          if (ev.type === "gameover") beep(90, 0.4, "sawtooth", 0.07);
          if (ev.type === "level") beep(660, 0.12, "square", 0.05);
        }
      }

      function sizeCanvas(canvas, cssW, cssH) {
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
      }

      function cellSize() {
        const styles = getComputedStyle(document.documentElement);
        return parseFloat(styles.getPropertyValue("--cell")) || 30;
      }

      function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function drawBlock(ctx, x, y, size, color, ghost) {
        const pad = 1.5;
        ctx.save();
        roundRect(ctx, x + pad, y + pad, size - pad * 2, size - pad * 2, 5);
        if (ghost) {
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.7;
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          const g = ctx.createLinearGradient(x, y, x, y + size);
          g.addColorStop(0, shade(color, 1.18));
          g.addColorStop(1, shade(color, 0.72));
          ctx.fillStyle = g;
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.22)";
          roundRect(ctx, x + pad + 3, y + pad + 3, (size - pad * 2) * 0.42, 5, 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function shade(hex, k) {
        const n = parseInt(hex.slice(1), 16);
        let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        r = Math.max(0, Math.min(255, Math.round(r * k)));
        g = Math.max(0, Math.min(255, Math.round(g * k)));
        b = Math.max(0, Math.min(255, Math.round(b * k)));
        return "rgb(" + r + "," + g + "," + b + ")";
      }

      function drawMini(canvas, type, faded) {
        const w = 96, h = 72;
        const ctx = sizeCanvas(canvas, w, h);
        ctx.clearRect(0, 0, w, h);
        if (!type) return;
        const cells = E.SHAPES[type][0];
        let minX = 9, minY = 9, maxX = 0, maxY = 0;
        for (let i = 0; i < cells.length; i++) {
          minX = Math.min(minX, cells[i][0]);
          minY = Math.min(minY, cells[i][1]);
          maxX = Math.max(maxX, cells[i][0]);
          maxY = Math.max(maxY, cells[i][1]);
        }
        const bw = maxX - minX + 1;
        const bh = maxY - minY + 1;
        const size = 16;
        const ox = (w - bw * size) / 2 - minX * size;
        const oy = (h - bh * size) / 2 - minY * size;
        ctx.globalAlpha = faded ? 0.35 : 1;
        for (let i = 0; i < cells.length; i++) {
          drawBlock(ctx, ox + cells[i][0] * size, oy + cells[i][1] * size, size, COLORS[type], false);
        }
      }

      function drawBoard() {
        const size = cellSize();
        const w = 10 * size;
        const h = 20 * size;
        boardCanvas.style.width = w + "px";
        boardCanvas.style.height = h + "px";
        const ctx = sizeCanvas(boardCanvas, w, h);
        ctx.fillStyle = "#050814";
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(120,190,255,0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= 10; x++) {
          ctx.beginPath();
          ctx.moveTo(x * size + 0.5, 0);
          ctx.lineTo(x * size + 0.5, h);
          ctx.stroke();
        }
        for (let y = 0; y <= 20; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * size + 0.5);
          ctx.lineTo(w, y * size + 0.5);
          ctx.stroke();
        }

        const view = E.getView(game);
        const hidden = E.HIDDEN;
        const flash = view.clearing ? view.clearing.rows : [];

        for (let y = hidden; y < E.ROWS; y++) {
          for (let x = 0; x < E.COLS; x++) {
            const t = view.board[y][x];
            if (!t) continue;
            const flashing = flash.indexOf(y) >= 0;
            drawBlock(ctx, x * size, (y - hidden) * size, size, flashing ? "#ffffff" : COLORS[t], false);
          }
        }

        if (view.piece && view.state !== "ready") {
          const gy = view.ghostY;
          const ghostCells = E.cellsOf(view.piece.type, view.piece.rot, view.piece.x, gy);
          for (let i = 0; i < ghostCells.length; i++) {
            const x = ghostCells[i][0];
            const y = ghostCells[i][1] - hidden;
            if (y >= 0) drawBlock(ctx, x * size, y * size, size, COLORS[view.piece.type], true);
          }
          const cells = E.cellsOf(view.piece.type, view.piece.rot, view.piece.x, view.piece.y);
          for (let i = 0; i < cells.length; i++) {
            const x = cells[i][0];
            const y = cells[i][1] - hidden;
            if (y >= 0) drawBlock(ctx, x * size, y * size, size, COLORS[view.piece.type], false);
          }
        }

        document.getElementById("score").textContent = String(view.score);
        document.getElementById("lines").textContent = String(view.lines);
        document.getElementById("level").textContent = String(view.level);
        if (view.score > high) {
          high = view.score;
          localStorage.setItem(HIGH_KEY, String(high));
          document.getElementById("high").textContent = String(high);
        }
        drawMini(holdCanvas, view.hold, !view.canHold);
        for (let i = 0; i < 3; i++) drawMini(nextCanvases[i], view.next[i], false);

        if (view.state === "ready") {
          overlay.classList.remove("hidden");
          overlayTitle.textContent = "准备开始";
          overlayText.textContent = "消除整行得分，方块叠到顶部游戏结束。";
          startBtn.textContent = "开始游戏";
        } else if (view.state === "paused") {
          overlay.classList.remove("hidden");
          overlayTitle.textContent = "已暂停";
          overlayText.textContent = "按 P 或点击继续。";
          startBtn.textContent = "继续";
        } else if (view.state === "gameover") {
          overlay.classList.remove("hidden");
          overlayTitle.textContent = "游戏结束";
          overlayText.textContent = "得分 " + view.score + "  ·  最高 " + high;
          startBtn.textContent = "再来一局";
        } else {
          overlay.classList.add("hidden");
        }
      }

      function act(name) {
        const now = performance.now();
        if (name === "start" || name === "restart") {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          if (name === "restart") E.restart(game, now);
          else E.start(game, now);
          handleEvents(game.events);
          drawBoard();
          return;
        }
        if (name === "pause") {
          if (game.state === "ready") return act("start");
          E.pause(game);
          drawBoard();
          return;
        }
        game.events = [];
        if (name === "left") E.move(game, -1);
        if (name === "right") E.move(game, 1);
        if (name === "down") E.softDrop(game);
        if (name === "hard") E.hardDrop(game);
        if (name === "rotate") E.rotate(game, 1);
        if (name === "rotateCCW") E.rotate(game, -1);
        if (name === "hold") E.hold(game);
        handleEvents(game.events);
        drawBoard();
      }

      function loop(now) {
        if (game.state === "playing" || game.state === "clearing") {
          if (keys.ArrowDown || keys.KeyS) {
            if (!loop._soft || now - loop._soft > 45) {
              E.softDrop(game);
              handleEvents(game.events);
              loop._soft = now;
            }
          }
          if (dasDir) {
            if (now >= dasAt && now - arrAt >= ARR) {
              E.move(game, dasDir);
              handleEvents(game.events);
              arrAt = now;
            }
          }
          const events = E.tick(game, now);
          handleEvents(events);
        }
        drawBoard();
        requestAnimationFrame(loop);
      }

      function bindKey(code, down) {
        if (down) keys[code] = true;
        else delete keys[code];
      }

      window.addEventListener("keydown", function (e) {
        if (e.repeat && (e.code === "Space" || e.code === "KeyC" || e.code === "KeyP" || e.code === "KeyR")) {
          e.preventDefault();
          return;
        }
        const map = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowDown: "down",
          KeyS: "down",
          ArrowUp: "rotate",
          KeyW: "rotate",
          Space: "hard",
          KeyZ: "rotateCCW",
          KeyX: "rotate",
          KeyC: "hold",
          ShiftLeft: "hold",
          KeyP: "pause",
          Escape: "pause",
          KeyR: "restart",
          Enter: game.state === "playing" ? "" : "start",
        };
        if (map[e.code] != null) e.preventDefault();
        if (e.code === "ArrowLeft" || e.code === "KeyA") {
          if (!keys[e.code]) {
            act("left");
            dasDir = -1;
            dasAt = performance.now() + DAS;
            arrAt = 0;
          }
          bindKey(e.code, true);
          return;
        }
        if (e.code === "ArrowRight" || e.code === "KeyD") {
          if (!keys[e.code]) {
            act("right");
            dasDir = 1;
            dasAt = performance.now() + DAS;
            arrAt = 0;
          }
          bindKey(e.code, true);
          return;
        }
        bindKey(e.code, true);
        const name = map[e.code];
        if (name) act(name);
      });

      window.addEventListener("keyup", function (e) {
        bindKey(e.code, false);
        if (e.code === "ArrowLeft" || e.code === "KeyA" || e.code === "ArrowRight" || e.code === "KeyD") {
          if (!(keys.ArrowLeft || keys.KeyA || keys.ArrowRight || keys.KeyD)) dasDir = 0;
          else dasDir = keys.ArrowLeft || keys.KeyA ? -1 : 1;
        }
      });

      startBtn.addEventListener("click", function () {
        if (game.state === "paused") act("pause");
        else act("start");
      });

      muteBtn.addEventListener("click", function () {
        muted = !muted;
        localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
        muteBtn.textContent = muted ? "声音 关" : "声音 开";
      });
      muteBtn.textContent = muted ? "声音 关" : "声音 开";

      document.querySelectorAll(".controls button").forEach(function (btn) {
        const name = btn.getAttribute("data-act");
        let timer = null;
        const startRepeat = function () {
          act(name);
          if (name === "left" || name === "right" || name === "down") {
            timer = setInterval(function () { act(name); }, name === "down" ? 45 : ARR);
          }
        };
        const stop = function () { if (timer) { clearInterval(timer); timer = null; } };
        btn.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          startRepeat();
        });
        btn.addEventListener("pointerup", stop);
        btn.addEventListener("pointercancel", stop);
        btn.addEventListener("pointerleave", stop);
      });

      window.addEventListener("resize", drawBoard);
      drawBoard();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
